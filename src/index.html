<!doctype html>
<html class="scrollbar-none">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d34b88e3f6.js" crossorigin="anonymous"></script>
</head>

<body>
    <header class="bg-black sticky top-0 z-50 py-4 px-8 text-white shadow-md">

        <nav class="flex items-center justify-between md:justify-around">
            <div class="flex items-center gap-2">
                <img src="./assets/img/brandlogo.webp" alt="brand" class="w-[35px]">
                <h1 class="text-xl font-bold">DocGenAI</h1>
            </div>
            <i class="fa-solid fa-bars md:!hidden"></i>
            <ul class=" gap-4 text-gray-400 text-sm font-medium hidden md:flex">
                <li class="duration-150 hover:text-white "><a href="#" class="">How It Works</a></li>
                <li class="duration-150 hover:text-white "><a href="#" class="">Documents</a></li>
                <li class="duration-150 hover:text-white "><a href="#" class="">Pricing</a></li>
            </ul>
            <div class="flex gap-1 text-sm font-medium items-center hidden md:flex">
                <button
                    class="py-1.5 px-4 rounded-lg duration-150 hover:bg-red-600 cursor-pointer hover:text-white">Sign
                    In</button>
                <button
                    class="bg-red-600 py-1.5 px-4 ml-4 rounded-lg duration-150 cursor-pointer hover:bg-white hover:text-red-600 ">Sign
                    Up</button>
            </div>
        </nav>

    </header>

    <!-- Header and Main Merged -->


    <main class="">

        <!-- Hero Section  Start-->
        <section class="py-16 lg:py-32 px-8 grid items-center justify-center gap-4 bg-black md:flex md:justify-around ">

            <div class="grid gap-4 md:w-1/2 md:gap-8 lg:w-1/3">
                <span
                    class="flex items-center gap-1 text-sm  py-1.5 px-4 border-red-700 border-1 bg-red-900/50  text-red-600 rounded-full w-fit"><i
                        class="fa-solid fa-circle text-[8px]"></i> Trusted by 10,000+ companies</span>
                <h1 class="text-6xl text-center grid gap-1 font-black text-white md:text-left">Legal Docs <span
                        class="text-red-600">in Minutes</span></h1>
                <p class="text-gray-400 font-medium">Generate compliant NDAs, contracts, and policies with Al. Fast,
                    affordable, and simple-no
                    lawyer required.</p>
                <div class="flex gap-3 text-sm">
                    <button
                        class="bg-red-600 border-1 border-red-700 text-white py-2 px-4 rounded-lg cursor-pointer duration-150 hover:bg-white hover:text-black ">Start
                        Free</button>
                    <button
                        class="bg-transparent text-white border-1 border-red-700 py-2 px-4 rounded-lg cursor-pointer duration-150 hover:bg-red-600  ">View
                        Samples</button>
                </div>
            </div>

            <div
                class="py-2 px-4 w-fit grid items-center justify-center border-red-900 border-1 bg-red-200/50 text-red-600 rounded-lg bg-transparent bg-linear-to-br from-red-900/50 to-gray-500/50 ">
                <div class="">
                    <img src="./assets/img/heroimg.png" alt="heroimg" class="md:w-[250px] lg:w-[400px]">
                </div>
                <p class="text-center text-gray-400 font-medium py-5">Al-Powered Document Generation</p>
            </div>
        </section>
        <!-- Hero Section  End-->


    </main>

    <footer class="">



    </footer>

</body>

</html>
