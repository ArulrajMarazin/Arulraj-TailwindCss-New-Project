<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d34b88e3f6.js" crossorigin="anonymous"></script>
</head>

<body>
    <header class="">

        

    </header>

    <main class="">

        <!-- Templates Section Start -->

        <section class="bg-black grid gap-4 text-white py-16 px-8">

            <h1 class="text-3xl font-black text-center">Document Templates</h1>
            <p class="text-gray-300 text-center">Professional, attorney-reviewed templates for every business need</p>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-5 justify-between">

                <div class="text-center bg-gray-600/50 p-4 grid gap-4 rounded-lg border-1 border-gray-700">
                    <div class="text-3xl"><i class="fa-regular fa-handshake"></i></div>
                    <h3 class="font-medium">NDA (Mutual)</h3>
                </div>
                <div class="text-center bg-gray-600/50 p-4 grid gap-4 rounded-lg border-1 border-gray-700">
                    <div class="text-3xl"><i class="fa-solid fa-user-lock"></i></div>
                    <h3 class="font-medium">NDA (Non-Mutual)</h3>
                </div>
                <div class="text-center bg-gray-600/50 p-4 grid gap-4 rounded-lg border-1 border-gray-700">
                    <div class="text-3xl"><i class="fa-solid fa-clipboard"></i></div>
                    <h3 class="font-medium">Privacy Policy</h3>
                </div>
                <div class="text-center bg-gray-600/50 p-4 grid gap-4 rounded-lg border-1 border-gray-700">
                    <div class="text-3xl"><i class="fa-solid fa-scale-balanced"></i></div>
                    <h3 class="font-medium">Terms of Service</h3>
                </div>
                <div class="text-center bg-gray-600/50 p-4 grid gap-4 rounded-lg border-1 border-gray-700">
                    <div class="text-3xl"><i class="fa-solid fa-briefcase"></i></div>
                    <h3 class="font-medium">Freelance Contract</h3>
                </div>
                <div class="text-center bg-gray-600/50 p-4 grid gap-4 rounded-lg border-1 border-gray-700">
                    <div class="text-3xl"><i class="fa-solid fa-users"></i></i></div>
                    <h3 class="font-medium">Employment Agreement</h3>
                </div>
                <div class="text-center bg-gray-600/50 p-4 grid gap-4 rounded-lg border-1 border-gray-700">
                    <div class="text-3xl"><i class="fa-solid fa-phone"></i></i></div>
                    <h3 class="font-medium">Consulting Agreement</h3>
                </div>
                <div class="text-center bg-gray-600/50 p-4 grid gap-4 rounded-lg border-1 border-gray-700">
                    <div class="text-3xl"><i class="fa-solid fa-file-contract"></i></div>
                    <h3 class="font-medium">Service Agreement</h3>
                </div>

            </div>

        </section>

        <!-- Templates Section End -->

    </main>

    <footer class="">



    </footer>

</body>

</html>
